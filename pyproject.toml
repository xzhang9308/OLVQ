[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olvq"
version = "0.2.0"
description = "Learnable E8, orthogonal and nonorthogonal lattice quantization for neural image compression"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = ["torch==2.2.2", "torchvision==0.17.2", "compressai==1.2.6", "numpy>=1.24,<2", "scipy>=1.10,<1.14", "Pillow>=9", "einops==0.6.1", "timm==0.9.16"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[project.scripts]
olvq = "olvq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"olvq.vendor" = ["TCM-LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
